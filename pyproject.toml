[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-hazardmaker"
version = "0.3.3"
description = "Turn ground-motion data into hazard layers for the ShakeReady map"
readme = "README.md"
authors = [{name = "E. Taciroglu"}]
license = {text = "BSD-3-Clause"}
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]
requires-python = ">=3.9"
dependencies = []
keywords = ["earthquake", "seismic hazard", "ShakeMap", "ground motion", "ShakeReady"]

[project.urls]
Homepage = "https://trg-ucla.github.io/SR-HazardMaker/"
Repository = "https://github.com/TRG-UCLA/SR-HazardMaker"
DOI = "https://doi.org/10.5281/zenodo.24356049"

[project.scripts]
sr-hazardmaker = "sr_hazardmaker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
